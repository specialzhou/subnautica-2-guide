name: 检查官方 Wiki 修订

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: official-wiki-revisions
  cancel-in-progress: false

jobs:
  check:
    name: 检查 Wiki 修订
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 导入最新 Wiki 修订
        run: npm run import:wiki
      - name: 验证生成记录
        run: npm run validate
      - name: 拒绝异常数据减少
        run: npm run validate:wiki-import
      - name: 检测来源变更
        id: changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git diff --stat
            git status --short
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 自动提交并发布至 main
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore(wiki): 自动同步官方 Wiki 最新修订与多语言页面"
          git pull --rebase origin main
          git push origin main

          missing_section=""
          if [[ -f "data/missing-translations.json" ]]; then
            missing_count=$(jq -r '.missingCount // 0' data/missing-translations.json)
            if [[ "$missing_count" -gt 0 ]]; then
              missing_list=$(jq -r '.items[] | "- `" + .english + "` (缺少: " + (.missingLocales | join(", ")) + ")"' data/missing-translations.json)
              missing_section=$(printf "\n\n> [!NOTE]\n> **待办本地化记录**：检测到 %s 个新增词条暂无翻译，已自动降级使用英文原名显示：\n%s\n" "$missing_count" "$missing_list")
            fi
          fi

          echo "✅ 官方 Wiki 修订与多语言页面已自动验证并同步至 main 分支。" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$missing_section" ]]; then
            echo "$missing_section" >> "$GITHUB_STEP_SUMMARY"
          fi
