name: 收集玩家问题候选

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: player-question-candidates
  cancel-in-progress: false

jobs:
  collect:
    name: 收集玩家问题候选
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 收集新的 Reddit 问题候选
        env:
          REDDIT_USER_AGENT: linux:com.specialzhou.subnautica2guide:v0.2.0 (by /u/Comprehensive-Push20)
        run: node scripts/collect-player-question-candidates.mjs --feeds="https://www.reddit.com/r/Subnautica_2/new/.rss?limit=100,https://www.reddit.com/r/Subnautica/new/.rss?limit=100" --max-details=4 --detail-delay-ms=65000 --fetch-attempts=3 --fetch-retry-delay-ms=5000 --allow-stale-feed
      - name: 验证候选队列和生成页面
        run: npm run validate
      - name: 自动提交并同步至 main
        run: |
          if git diff --quiet -- data/player-question-candidates.json data/player-question-candidates.md; then
            echo "候选队列没有变化。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/player-question-candidates.json data/player-question-candidates.md
          git commit -m "chore(questions): 自动更新玩家问题候选"
          git pull --rebase origin main
          git push origin main
          echo "✅ 玩家问题候选已自动验证并同步至 main 分支。" >> "$GITHUB_STEP_SUMMARY"
